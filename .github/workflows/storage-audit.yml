name: Production storage audit
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'audit只读；trim-journal-100m清理日志；cleanup-approved仅清理已审核的旧镜像及转储'
        type: choice
        default: audit
        options: [audit, trim-journal-100m, cleanup-approved]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Disk inventory and explicitly requested journal retention
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          OPERATION: ${{ inputs.operation }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/audit_key
          chmod 600 ~/.ssh/audit_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          if [ "$OPERATION" = trim-journal-100m ]; then
            scp -i ~/.ssh/audit_key deploy/journald-storage.conf "$DEPLOY_USER@$DEPLOY_HOST:/tmp/meme-journald-storage.conf"
          fi
          if [ "$OPERATION" = cleanup-approved ]; then
            scp -i ~/.ssh/audit_key deploy/cleanup-approved-storage.sh "$DEPLOY_USER@$DEPLOY_HOST:/tmp/meme-cleanup-approved-storage.sh"
          fi
          ssh -i ~/.ssh/audit_key "$DEPLOY_USER@$DEPLOY_HOST" "sh -s -- '$OPERATION'" > storage-audit.txt <<'REMOTE'
          set -eu
          case "$1" in
            audit|'') ;;
            cleanup-approved)
              sh /tmp/meme-cleanup-approved-storage.sh
              exit 0
              ;;
            trim-journal-100m)
              journalctl --disk-usage
              df -h /
              install -d -m 755 /etc/systemd/journald.conf.d
              install -m 644 /tmp/meme-journald-storage.conf /etc/systemd/journald.conf.d/99-meme-storage.conf
              systemctl restart systemd-journald
              journalctl --rotate
              journalctl --vacuum-size=100M
              systemctl is-active systemd-journald
              journalctl --disk-usage
              systemd-analyze cat-config systemd/journald.conf
              ;;
            *) exit 1;;
          esac
          date -Is
          df -hT
          lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINTS
          losetup --list --output NAME,BACK-FILE,SIZELIMIT || true
          du -x -B1 --max-depth=2 / 2>/dev/null | sort -nr | head -60
          # Allocated blocks distinguish sparse image files from real disk use.
          find / -xdev -type f -size +100M -printf '%b blocks\t%s bytes\t%p\n' 2>/dev/null | sort -nr | head -40
          if command -v lsof >/dev/null 2>&1; then lsof -nP +L1 2>/dev/null | head -30 || true; fi
          docker system df -v
          docker system df
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          docker ps -aq | while read -r id; do docker inspect -f '{{.Name}} {{json .Mounts}}' "$id"; done
          journalctl --disk-usage
          du -x -h --max-depth=1 /var /opt /root /tmp /home 2>/dev/null | sort -h
          du -x -h --max-depth=1 /var/lib /var/log /var/cache 2>/dev/null | sort -h
          docker ps -aq | while read -r id; do
            log=$(docker inspect -f '{{.LogPath}}' "$id")
            if [ -n "$log" ] && [ -f "$log" ]; then du -h "$log"; fi
          done
          docker exec -i -w /app/apps/api meme-backtesting-api node --input-type=module <<'JS'
          import pg from 'pg';
          const pool=new pg.Pool({connectionString:process.env.DATABASE_URL});
          try {
            await pool.query('SET default_transaction_read_only=on');
            for (const [label,sql] of [
              ['database',`SELECT pg_size_pretty(pg_database_size(current_database())) AS size`],
              ['all_databases',`SELECT datname,pg_size_pretty(pg_database_size(oid)) size FROM pg_database ORDER BY pg_database_size(oid) DESC`],
              ['largest_tables',`SELECT relname,pg_size_pretty(pg_total_relation_size(relid)) total,pg_size_pretty(pg_table_size(relid)) data,pg_size_pretty(pg_indexes_size(relid)) indexes,n_live_tup,n_dead_tup,last_autovacuum,last_vacuum FROM pg_stat_user_tables ORDER BY pg_total_relation_size(relid) DESC LIMIT 25`],
              ['batch',`SELECT batch_id,status,wave,last_error FROM backtest_batch_control`],
              ['batch_ledger',`SELECT batch_id,state,count(*) FROM backtest_batch_items GROUP BY 1,2`],
              ['pruned_residual_runs',`SELECT count(*) FROM backtest_batch_items i JOIN backtest_runs r ON r.id=i.run_id WHERE i.state='pruned'`],
              ['batch_live_runs',`SELECT r.status,count(*) FROM backtest_runs r WHERE config_json->'batch'->>'id'='fib-grid-20260920-v1' GROUP BY 1`]
            ]) console.log(label,JSON.stringify((await pool.query(sql)).rows));
          } finally {await pool.end();}
          JS
          REMOTE
          cat storage-audit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storage-audit-${{ github.run_id }}
          path: storage-audit.txt
