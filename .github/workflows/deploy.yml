name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: meme_runtime_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/meme_runtime_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter @meme/domain build
      - run: pnpm --filter @meme/engine build
      - run: pnpm test:research
      - run: python3 scripts/test_signal_entry_manifest.py
      - run: python3 scripts/test_token_signal_manifest.py
      - run: python3 .agents/skills/meme-kline-import/scripts/test_import_meme_klines.py
      - run: python3 .agents/skills/meme-kline-import/scripts/test_signal_import.py
        env:
          IMPORT_TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: pnpm --filter @meme/runtime build
      - run: pnpm test
      - run: pnpm --filter @meme/api build
      - run: pnpm --filter @meme/worker build
      - run: pnpm --filter @meme/web build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Upload source
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          tar --exclude=.git --exclude=node_modules --exclude='apps/web/public/charting_library' -czf /tmp/meme-backtesting.tgz .
          scp -i ~/.ssh/deploy_key /tmp/meme-backtesting.tgz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/meme-backtesting.tgz"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH' && tar -xzf /tmp/meme-backtesting.tgz -C '$DEPLOY_PATH' && rm -f /tmp/meme-backtesting.tgz"
      - name: Migrate and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          MEMEINFO_SIGNAL_TOKEN: ${{ secrets.MEMEINFO_SIGNAL_TOKEN }}
          XXYY_TRADE_CHANNEL_TEMPLATE: ${{ secrets.XXYY_TRADE_CHANNEL_TEMPLATE }}
          XXYY_TRADE_EVENT: ${{ secrets.XXYY_TRADE_EVENT }}
          XXYY_API_KEY: ${{ secrets.XXYY_API_KEY }}
          LIVE_ADMIN_PASSWORD_HASH: ${{ secrets.LIVE_ADMIN_PASSWORD_HASH }}
        run: |
          printf 'DATABASE_URL=%s\nREDIS_HOST=127.0.0.1\nREDIS_PORT=6379\nREDIS_PASSWORD=%s\nPORT=3000\nMEMEINFO_SIGNAL_TOKEN=%s\nXXYY_TRADE_CHANNEL_TEMPLATE=%s\nXXYY_TRADE_EVENT=%s\nXXYY_API_KEY=%s\nLIVE_ADMIN_PASSWORD_HASH=%s\nLIVE_TRADING_ENABLED=false\n' "$DATABASE_URL" "$REDIS_PASSWORD" "$MEMEINFO_SIGNAL_TOKEN" "$XXYY_TRADE_CHANNEL_TEMPLATE" "$XXYY_TRADE_EVENT" "$XXYY_API_KEY" "$LIVE_ADMIN_PASSWORD_HASH" | ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; cat > '$DEPLOY_PATH/deploy/.env'"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && sh deploy/release.sh"
